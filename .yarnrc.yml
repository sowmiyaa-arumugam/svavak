nodeLinker: node-modules  # classic node_modules tree, not Plug'n'Play: React Native's Metro bundler needs it (as in Amazon's sample)
nmHoistingLimits: workspaces  # each workspace keeps its own dependencies (as in Amazon's sample), so Expo's AppEntry finds apps/tv/App
